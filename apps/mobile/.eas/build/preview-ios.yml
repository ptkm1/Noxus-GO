build:
  name: Pedidos preview iOS
  steps:
    - eas/checkout
    - eas/use_npm_token
    - eas/install_node_modules
    - run:
        name: Build @pedidos/shared
        command: cd ../.. && npx pnpm@10.22.0 --filter @pedidos/shared run build
    - run:
        name: Prepare monorepo node_modules for Expo CLI
        command: |
          set -euo pipefail
          mkdir -p node_modules
          for pkg in expo expo-router expo-constants expo-modules-core react react-native; do
            if [ ! -e "node_modules/${pkg}" ] && [ -d "../../node_modules/${pkg}" ]; then
              ln -sf "../../node_modules/${pkg}" "node_modules/${pkg}"
            fi
          done
          node -e "console.log('expo sdk', require('expo/package.json').version)"
    - eas/resolve_build_config
    - run:
        name: Expo prebuild (iOS)
        command: pnpm exec expo prebuild --no-install --platform ios
    - eas/configure_eas_update:
        inputs:
          throw_if_not_configured: false
    - eas/install_pods
    - eas/resolve_apple_team_id_from_credentials
    - eas/configure_ios_credentials
    - eas/configure_ios_version
    - eas/generate_gymfile_from_template
    - eas/run_fastlane
    - eas/find_and_upload_build_artifacts
